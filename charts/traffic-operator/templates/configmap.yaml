apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "traffic-operator.configName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "traffic-operator.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
data:
  DEFAULT_PROBE_IMAGE: {{ .Values.probe.defaultImage | quote }}
