name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'gh-pages'
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'api/**'
      - 'config/crd/**'
      - 'charts/traffic-operator/crds/**'
  pull_request:
    branches-ignore:
      - 'gh-pages'
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'api/**'
      - 'config/crd/**'
      - 'charts/traffic-operator/crds/**'

jobs:
  test-e2e:
    name: Run on Ubuntu
    # Prevents the job from running even if manually triggered on gh-pages
    if: github.ref != 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          #make test-2e2
