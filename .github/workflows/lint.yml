name: Lint

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:
    branches-ignore:
      - 'gh-pages'

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout=3m
          version: v2.15.0
          skip-cache: true
          skip-save-cache: true
          cache-invalidation-interval: 15