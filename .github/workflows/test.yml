name: Tests

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'gh-pages'
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'api/**'
      - 'config/crd/**'
      - 'charts/traffic-operator/templates/network.djkormo.github.io_trafficchecks.yaml'
  pull_request:
    branches-ignore:
      - 'gh-pages'
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'api/**'
      - 'config/crd/**'
      - 'charts/traffic-operator/templates/network.djkormo.github.io_trafficchecks.yaml'

jobs:
  test:
    name: Run on Ubuntu
    # Prevents the job from running even if manually triggered on gh-pages
    if: github.ref != 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
